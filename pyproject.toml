[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix-agent"
version = "0.1.1"
description = "Evidence-gated GUI testing and repair agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.12.5", "langgraph==1.0.10", "langgraph-checkpoint-postgres==3.0.4",
  "psycopg[binary,pool]==3.3.3", "mcp==1.26.0", "rich==14.3.3",
  "prompt_toolkit==3.0.52", "httpx[socks]==0.28.1", "PyYAML==6.0.3",
  "tree-sitter==0.25.2", "tree-sitter-typescript==0.23.2",
]
[project.scripts]
tracefix = "tracefix.cli.main:main"
[tool.setuptools.packages.find]
where = ["backend/packages/agent/src"]
[tool.setuptools.package-data]
"tracefix.storage" = ["*.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/packages/agent/src"]
asyncio_mode = "auto"
