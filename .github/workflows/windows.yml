name: Windows Web console checks
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python environment with native PowerShell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-index --find-links vendor/wheels-win_amd64 -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          exit $LASTEXITCODE
      - name: Check Python runtime dependencies
        run: |
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -c "import claude_agent_sdk, tracefix.agents.claude_sdk_adapter; from pydantic_ai.models.openai import OpenAIChatModel"
          exit $LASTEXITCODE
      - name: Verify PowerShell script encoding and syntax
        run: ./.venv/Scripts/python.exe -m pytest tests/test_web_startup.py -k powershell -q
      - name: Install and check Node runtime dependencies
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe scripts/codegraph/deploy_codegraph.py --check
          exit $LASTEXITCODE
      - name: Build console service for Python integration tests
        run: npm run build --workspace @tracefix/console-service
      - name: Prepare pinned test repository and verify all mutation baselines
        run: ./.venv/Scripts/python.exe bugboard/scripts/prepare_target.py --verify-cases
      - name: Unit and platform tests
        run: ./.venv/Scripts/python.exe -m pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Upload Python JUnit results
        if: ${{ always() && hashFiles('artifacts/pytest-results.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-python-junit
          path: artifacts/pytest-results.xml
          if-no-files-found: error
      - name: Native backend HTTP
        run: ./.venv/Scripts/python.exe scripts/checks/check_backend.py
      - name: TypeScript and build
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
