name: Windows native smoke
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap with native PowerShell (explicit fake model)
        run: ./tools/bootstrap/start.ps1 --smoke --plain
      - name: Unit and platform tests
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Upload Python JUnit results
        if: ${{ always() && hashFiles('artifacts/pytest-results.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-junit
          path: artifacts/pytest-results.xml
          if-no-files-found: error
      - name: Native backend HTTP
        run: ./.venv/Scripts/python.exe tools/checks/check_backend.py
      - name: TypeScript and build
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
