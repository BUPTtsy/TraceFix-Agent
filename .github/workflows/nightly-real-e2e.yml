name: Nightly real model E2E

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRACEFIX_API_KEY: ${{ secrets.TRACEFIX_API_KEY }}
      TRACEFIX_BASE_URL: ${{ vars.TRACEFIX_BASE_URL || 'https://api.deepseek.com' }}
      TRACEFIX_TEXT_MODEL: ${{ vars.TRACEFIX_TEXT_MODEL || 'deepseek-chat' }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check real E2E prerequisites
        run: python scripts/checks/verify_real_e2e.py --required --preflight-only --case B01 --output artifacts/real-e2e/report.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Check Python runtime dependencies
        run: |
          python -m pip check
          python -c "import tracefix.agents.deepagents_adapter; from pydantic_ai.models.openai import OpenAIChatModel"
      - name: Run real BugBoard B01 E2E
        run: python scripts/checks/verify_real_e2e.py --required --case B01 --output artifacts/real-e2e/report.json
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-e2e-report
          path: artifacts/real-e2e/report.json
          if-no-files-found: error
