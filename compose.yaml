services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: tracefix
      POSTGRES_USER: tracefix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["tracefix-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefix -d tracefix"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [control]
networks:
  control: {}
volumes:
  tracefix-postgres: {}
